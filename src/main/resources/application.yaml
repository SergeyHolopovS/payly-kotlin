spring:
  application:
    name: payly

  datasource:
    url: jdbc:postgresql://localhost:5432/payly
    username: payly
    password: payly

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
    show-sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration

  data:
    redis:
      repositories:
        enabled: false
      host: localhost
      port: 6379

  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: payly
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer

payment:
  supported-currencies: ${PAYMENT_SUPPORTED_CURRENCIES:RUB,USD,EUR}
  processing:
    min-delay-seconds: ${PAYMENT_PROCESSING_MIN_DELAY_SECONDS:1}
    max-delay-seconds: ${PAYMENT_PROCESSING_MAX_DELAY_SECONDS:5}
    batch-size: ${PAYMENT_PROCESSING_BATCH_SIZE:100}
    poll-interval-ms: ${PAYMENT_PROCESSING_POLL_INTERVAL_MS:1000}

outbox:
  publisher:
    topic: ${OUTBOX_PUBLISHER_TOPIC:payment.events}
    batch-size: ${OUTBOX_PUBLISHER_BATCH_SIZE:100}
    poll-interval-ms: ${OUTBOX_PUBLISHER_POLL_INTERVAL_MS:5000}

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info
