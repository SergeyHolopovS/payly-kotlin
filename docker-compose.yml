services:
  app:
    build: .
    ports:
      - "8080:8080"
      # Actuator (health, prometheus) — для локальной разработки; в проде этот порт наружу не публикуется
      - "8081:8081"
    environment:
      MANAGEMENT_SERVER_PORT: ${MANAGEMENT_SERVER_PORT:-8081}
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/payly
      SPRING_DATASOURCE_USERNAME: payly
      SPRING_DATASOURCE_PASSWORD: payly
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      PAYMENT_SUPPORTED_CURRENCIES: ${PAYMENT_SUPPORTED_CURRENCIES:-RUB,USD,EUR}
      PAYMENT_PROCESSING_MIN_DELAY_SECONDS: ${PAYMENT_PROCESSING_MIN_DELAY_SECONDS:-1}
      PAYMENT_PROCESSING_MAX_DELAY_SECONDS: ${PAYMENT_PROCESSING_MAX_DELAY_SECONDS:-5}
      PAYMENT_PROCESSING_BATCH_SIZE: ${PAYMENT_PROCESSING_BATCH_SIZE:-100}
      PAYMENT_PROCESSING_POLL_INTERVAL_MS: ${PAYMENT_PROCESSING_POLL_INTERVAL_MS:-1000}
      OUTBOX_PUBLISHER_TOPIC: ${OUTBOX_PUBLISHER_TOPIC:-payment.events}
      OUTBOX_PUBLISHER_BATCH_SIZE: ${OUTBOX_PUBLISHER_BATCH_SIZE:-100}
      OUTBOX_PUBLISHER_POLL_INTERVAL_MS: ${OUTBOX_PUBLISHER_POLL_INTERVAL_MS:-5000}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_started
    # readiness-проба Actuator: контейнер healthy, только когда подняты БД и Redis
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:${MANAGEMENT_SERVER_PORT:-8081}/actuator/health/readiness || exit 1"]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 5

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: payly
      POSTGRES_USER: payly
      POSTGRES_PASSWORD: payly
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U payly -d payly"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  kafka:
    image: apache/kafka:3.9.0
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

  # ---- Мониторинг ----
  # Prometheus собирает метрики с app:8081/actuator/prometheus и хранит историю
  prometheus:
    image: prom/prometheus:v3.5.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=7d
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus:/etc/prometheus:ro
      - prometheus_data:/prometheus

  # Grafana: источник данных и дашборд "Payly — обзор" подключаются сами (provisioning)
  grafana:
    image: grafana/grafana:12.1.0
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      # Локальный стенд: смотреть дашборды можно без логина, править — только под админом
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      # Дашборд payly открывается сразу, без перехода по меню
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/payly.json
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus

volumes:
  postgres_data:
  prometheus_data:
  grafana_data:
