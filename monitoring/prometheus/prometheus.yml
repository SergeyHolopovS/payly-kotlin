# Prometheus для локального стенда: забирает метрики payly с management-порта
# и хранит историю, по которой Grafana строит графики

global:
  # Совпадает с типичным продовым интервалом — rate()/increase() на дашборде ведут себя так же
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: payly
    metrics_path: /actuator/prometheus
    static_configs:
      # Имя сервиса из docker-compose и management.server.port (не порт API)
      - targets: ["app:8081"]
