# Источник данных подключается автоматически при старте Grafana.
# Фиксированный uid — на него ссылаются панели дашборда payly.json
apiVersion: 1

datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false
    jsonData:
      # = scrape_interval Prometheus: $__rate_interval не опустится ниже 4 скрейпов
      timeInterval: 15s
