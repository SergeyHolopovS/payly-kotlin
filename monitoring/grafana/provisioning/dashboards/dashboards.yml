# Дашборды из monitoring/grafana/dashboards загружаются при старте Grafana.
# Источник правды — JSON в репозитории: правки, сделанные в UI, Grafana сохранить не даст
apiVersion: 1

providers:
  - name: payly
    folder: Payly
    type: file
    allowUiUpdates: false
    options:
      path: /var/lib/grafana/dashboards
